# SPDX-License-Identifier: GPL-2.0-or-later
sonar.host.url=https://sonarcloud.io
sonar.organization=somethingwithproof
sonar.projectKey=somethingwithproof_cacti
sonar.projectName=Cacti
sonar.sourceEncoding=UTF-8

# Analyze application code and CI; keep tests separate from production sources.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php,tests/**/*.js,tests/**/*.py
# Cacti force-tracks shipped scripts/resources beneath broad .gitignore rules.
# Analyze those maintained files too; explicitly exclude generated runtime data.
sonar.scm.exclusions.disabled=true
# PHP uses the project-specific Cacti PHP conventions profile described in
# .github/sonar/php-profile.json. PHP-CS-Fixer enforces tabs and same-line braces.
# MariaDB/MySQL schema dumps cannot introduce PL/SQL constants for SQL literals.
# Retain SQL analysis and exempt only that inapplicable maintainability rule.
sonar.issue.ignore.multicriteria=mysqlSchemaLiterals,mysqlAuditLiterals
sonar.issue.ignore.multicriteria.mysqlSchemaLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.mysqlSchemaLiterals.resourceKey=cacti.sql
sonar.issue.ignore.multicriteria.mysqlAuditLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.mysqlAuditLiterals.resourceKey=docs/audit_schema.sql
# These single-file dependencies are maintained by their upstream projects.
sonar.exclusions=tests/**,include/vendor/**,api/vendor/**,node_modules/**,include/fa/**,include/tabler/**,include/js/vendor/**,include/js/jquery.validate/**,include/js/LC_MESSAGES/**,include/js/jquery-ui.js,include/js/jquery.colorpicker.js,include/js/jquery.contextMenu.js,include/js/jquery.cookie.js,include/js/jquery.hotkeys.js,include/js/jquery.js,include/js/jquery.multiselect.filter.js,include/js/jquery.multiselect.js,include/js/jquery.tablednd.js,include/js/jquery.tablesorter.js,include/js/jquery.tablesorter.pager.js,include/js/jquery.tablesorter.widgets.js,include/js/jquery.timepicker.js,include/js/jquery.toast.js,include/js/jquery.ui.touch.punch.js,include/js/big.js,include/js/billboard.js,include/js/Chart.js,include/js/d3.js,include/js/htmx.js,include/js/js.storage.js,include/js/jstree.js,include/js/lzjs.js,include/js/pace.js,include/js/purify.js,include/js/screenfull.js,include/js/select2.js,**/*.min.js,**/*.min.css,**/*.map,cache/**,log/**,rra/**,coverage/**,include/config.php,include/config_local.php,.omc/**,.worktrees/**

# Reports are generated against this checkout before the scanner runs.
sonar.php.coverage.reportPaths=coverage/php.xml,coverage/php-browser.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/node.lcov.info
