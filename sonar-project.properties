sonar.host.url=https://sonarcloud.io
sonar.organization=somethingwithproof
sonar.projectKey=somethingwithproof_cacti
sonar.projectName=Cacti
sonar.sourceEncoding=UTF-8

# Analyze application code and CI; keep tests separate from production sources.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php,tests/**/*.js
# These single-file dependencies are maintained by their upstream projects.
sonar.exclusions=tests/**,include/vendor/**,api/vendor/**,node_modules/**,include/fa/**,include/tabler/**,include/js/vendor/**,include/js/jquery.validate/**,include/js/LC_MESSAGES/**,include/js/jquery*.js,include/js/big.js,include/js/billboard.js,include/js/Chart.js,include/js/d3.js,include/js/htmx.js,include/js/js.storage.js,include/js/jstree.js,include/js/lzjs.js,include/js/pace.js,include/js/purify.js,include/js/screenfull.js,**/*.min.js,**/*.min.css,**/*.map,cache/**,log/**,rra/**
