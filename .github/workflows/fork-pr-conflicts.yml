name: Forecast PR conflicts
on:
  push:
    branches: [ci/pr-conflict-tools]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: [develop, 1.2.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test contributor tooling
        run: |
          python3 -B -m unittest discover -s tests/tools -p 'test_forecast_pr_conflicts.py'
          python3 -B -m unittest discover -s tests/tools -p 'test_git_cacti_merge.py'
          python3 -B -m unittest discover -s tests/tools -p 'test_resolve_coverage_conflict.py'
      - name: Rehearse squash merges
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ matrix.base }}
          OWNER: ${{ github.repository_owner }}
        run: |
          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name')
          python3 tests/tools/forecast_pr_conflicts.py --github "$parent" --author "$OWNER" --base "$BASE" --json > forecast.json
          jq -r '. as $r | "Base `\($r.base)` · \($r.prs | length) open PRs\n\nVerified first batch in squash order\n\n" + ([$r.batches[0].order[]? | "#\(.number)"] | join(" → "))' forecast.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save verified sequences and conflict paths
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conflict-forecast-${{ matrix.base }}
          path: forecast.json
          retention-days: 14
