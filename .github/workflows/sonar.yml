# SPDX-License-Identifier: GPL-2.0-or-later
name: SonarQube

on:
  push:
    branches: [develop, 1.2.x]
  pull_request:
    branches: [develop, 1.2.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube analysis
    if: >-
      github.repository == 'somethingwithproof/cacti' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/1.2.x')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo '::error::SONAR_TOKEN must be configured in repository Actions secrets.'
            exit 1
          fi
      # workflow_dispatch does not automatically infer the selected branch.
      # Validate context before passing it to the scanner argument parser.
      - name: Select branch or pull request context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            [[ "$PR_HEAD" =~ ^[A-Za-z0-9._/-]+$ ]]
            [[ "$PR_BASE" =~ ^[A-Za-z0-9._/-]+$ ]]
            args="-Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$PR_HEAD -Dsonar.pullrequest.base=$PR_BASE"
          else
            case "$REF_NAME" in develop|1.2.x) ;; *) exit 1 ;; esac
            args="-Dsonar.branch.name=$REF_NAME"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            ${{ steps.context.outputs.args }}
