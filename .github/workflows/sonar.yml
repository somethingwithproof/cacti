# SPDX-License-Identifier: GPL-2.0-or-later
name: SonarQube

on:
  push:
    branches: [develop, 1.2.x]
  pull_request:
    branches: [develop, 1.2.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube analysis
    if: >-
      github.repository == 'somethingwithproof/cacti' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/1.2.x')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo '::error::SONAR_TOKEN must be configured in repository Actions secrets.'
            exit 1
          fi
      # workflow_dispatch does not automatically infer the selected branch.
      # Validate context before passing it to the scanner argument parser.
      - name: Select branch or pull request context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            [[ "$PR_HEAD" =~ ^[A-Za-z0-9._/-]+$ ]]
            [[ "$PR_BASE" =~ ^[A-Za-z0-9._/-]+$ ]]
            args="-Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$PR_HEAD -Dsonar.pullrequest.base=$PR_BASE"
          else
            case "$REF_NAME" in develop|1.2.x) ;; *) exit 1 ;; esac
            args="-Dsonar.branch.name=$REF_NAME"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Set up PHP for static browser fixtures
        if: hashFiles('tests/e2e/tests/client-state.spec.ts') != ''
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Set up Node for coverage collection
        if: hashFiles('tests/e2e/tests/client-state.spec.ts') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install locked coverage dependencies and Chromium
        if: hashFiles('tests/e2e/tests/client-state.spec.ts') != ''
        working-directory: tests/e2e
        run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Collect browser coverage against disposable Cacti 1.2
        if: hashFiles('tests/e2e/tests/client-state.spec.ts') != ''
        working-directory: tests/e2e
        env:
          CACTI_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/cacti-browser-coverage
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test --config=playwright.config.js external-window.spec.js --workers=1
          docker compose build --build-arg CACTI_E2E_COVERAGE=1
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T php mkdir -p /var/www/html/cacti/cache/realtime
          docker compose exec -T mariadb mariadb -ucactiuser -pcactipass cacti \
            -e "REPLACE INTO settings (name,value) VALUES ('realtime_enabled','on'),('realtime_cache_path','/var/www/html/cacti/cache/realtime');"
          node node_modules/@playwright/test/cli.js test --config=playwright.config.ts tests/client-state.spec.ts
          if [[ -f tests/document-semantics.spec.ts ]]; then
            docker compose exec -T mariadb mariadb -ucactiuser -pcactipass cacti \
              -e "UPDATE user_auth SET password_change='on' WHERE username='admin';"
            node node_modules/@playwright/test/cli.js test --config=playwright.config.ts tests/document-semantics.spec.ts
          fi
          if [[ -f tests/template-filter-labels.spec.ts ]]; then
            docker compose exec -T php php cli/import_package.php --filename=install/templates/Generic_SNMP_Device.xml.gz
            git -C ../.. restore --source=HEAD --worktree -- scripts/ss_hstats.php scripts/ping.pl resource/snmp_queries/interface.xml
            node node_modules/@playwright/test/cli.js test --config=playwright.config.ts tests/template-filter-labels.spec.ts
          fi
          if [[ -f tests/admin-filter-labels.spec.ts ]]; then
            node node_modules/@playwright/test/cli.js test --config=playwright.config.ts tests/admin-filter-labels.spec.ts
          fi
          if [[ -f tests/automation-filter-labels.spec.ts ]]; then
            node node_modules/@playwright/test/cli.js test --config=playwright.config.ts tests/automation-filter-labels.spec.ts
          fi
          node report-browser-coverage.js "$CACTI_BROWSER_COVERAGE_DIR" coverage/sonar-browser.xml
          node report-php-coverage.js ../../cache/php-coverage coverage/sonar-php.xml
      - name: Select measured coverage report
        id: coverage
        if: hashFiles('tests/e2e/tests/client-state.spec.ts') != ''
        run: |
          test -s tests/e2e/coverage/sonar-browser.xml
          test -s tests/e2e/coverage/sonar-php.xml
          echo 'args=-Dsonar.coverageReportPaths=tests/e2e/coverage/sonar-browser.xml,tests/e2e/coverage/sonar-php.xml' >> "$GITHUB_OUTPUT"
      - name: Tear down coverage fixture
        if: always() && hashFiles('tests/e2e/tests/client-state.spec.ts') != ''
        working-directory: tests/e2e
        run: docker compose down -v
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            ${{ steps.context.outputs.args }}
            ${{ steps.coverage.outputs.args }}
