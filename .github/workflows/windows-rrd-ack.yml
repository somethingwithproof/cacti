name: Windows RRDtool acknowledgement

on:
  pull_request:
    branches: [1.2.x]
    paths:
      - '.github/workflows/windows-rrd-ack.yml'
      - 'lib/rrd.php'
      - 'tests/Unit/Core/Rrd/RrdAcknowledgement*Test.php'
      - 'tests/phpunit-rrd-windows.xml'
  push:
    branches:
      - 'fix/rrd-windows-ack-timeout-**'
    paths:
      - '.github/workflows/windows-rrd-ack.yml'
      - 'lib/rrd.php'
      - 'tests/Unit/Core/Rrd/RrdAcknowledgement*Test.php'
      - 'tests/phpunit-rrd-windows.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-rrd-ack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows PHP ${{ matrix.php }} RRDtool acknowledgement timeout
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, openssl
          tools: composer:v2

      - name: Install locked test dependencies
        working-directory: tests
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Require native Windows PHP
        run: php -r "if (PHP_OS_FAMILY !== 'Windows') { exit(1); } echo PHP_OS_FAMILY, ' ', PHP_VERSION, PHP_EOL;"

      - name: Install a real Windows RRDtool (MSYS2)
        id: rrdtool
        shell: pwsh
        continue-on-error: true
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm mingw-w64-x86_64-rrdtool"
          $bin = 'C:\msys64\mingw64\bin\rrdtool.exe'
          if (-not (Test-Path $bin)) { throw 'rrdtool.exe not installed' }
          "CACTI_TEST_RRDTOOL=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $bin --version | Select-Object -First 1

      - name: Run acknowledgement timeout contracts
        working-directory: tests
        # The locked Pest 1 runner uses implicit nullable parameters deprecated in PHP 8.4.
        run: php -d error_reporting=24575 vendor/bin/pest --configuration=phpunit-rrd-windows.xml --colors=never
